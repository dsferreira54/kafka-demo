{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "35"
type: Opaque
stringData:
  database-user: {{ .Values.postgresql.user }}
  database-password: demo-password-123
  database-name: {{ .Values.postgresql.database }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "35"
data:
  custom.conf: |
    wal_level = logical
    max_wal_senders = 4
    max_replication_slots = 4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "35"
data:
  init.sh: |
    #!/bin/bash
    psql -d $POSTGRESQL_DATABASE <<'SQL'
    CREATE TABLE IF NOT EXISTS customers (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(200),
        city VARCHAR(100),
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );
    INSERT INTO customers (name, email, city) VALUES
        ('Alice Silva', 'alice@example.com', 'São Paulo'),
        ('Bob Santos', 'bob@example.com', 'Rio de Janeiro'),
        ('Carol Oliveira', 'carol@example.com', 'Belo Horizonte')
    ON CONFLICT DO NOTHING;
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: kafka-demo
    spec:
      containers:
        - name: postgresql
          image: image-registry.openshift-image-registry.svc:5000/openshift/{{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: database-name
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/pgsql/data
            - name: postgresql-config
              mountPath: /opt/app-root/src/postgresql-cfg
            - name: postgresql-init
              mountPath: /opt/app-root/src/postgresql-init
          resources:
            requests:
              cpu: {{ .Values.postgresql.resources.requests.cpu | quote }}
              memory: {{ .Values.postgresql.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.postgresql.resources.limits.cpu | quote }}
              memory: {{ .Values.postgresql.resources.limits.memory | quote }}
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-data
        - name: postgresql-config
          configMap:
            name: postgresql-config
        - name: postgresql-init
          configMap:
            name: postgresql-init
            defaultMode: 0755
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
{{- end }}
