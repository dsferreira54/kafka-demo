{{- if .Values.apps.consumer.enabled }}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: kafka-consumer
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: kafka-consumer
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: kafka-consumer
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: kafka-consumer
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  source:
    type: Git
    git:
      uri: {{ .Values.repoUrl | quote }}
      ref: main
    contextDir: {{ .Values.apps.consumer.contextDir | quote }}
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: "ubi8-openjdk-21:1.18"
  output:
    to:
      kind: ImageStreamTag
      name: kafka-consumer:latest
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: kafka-consumer
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "70"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"kafka-consumer:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"kafka-consumer\")].image"}]
spec:
  replicas: {{ .Values.apps.consumer.replicas }}
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
        app.kubernetes.io/name: kafka-consumer
        app.kubernetes.io/part-of: kafka-demo
    spec:
      containers:
        - name: kafka-consumer
          image: " "
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-cluster-kafka-bootstrap.{{ .Values.namespaces.kafka }}.svc:9092
          resources:
            requests:
              cpu: {{ .Values.apps.consumer.resources.requests.cpu | quote }}
              memory: {{ .Values.apps.consumer.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.apps.consumer.resources.limits.cpu | quote }}
              memory: {{ .Values.apps.consumer.resources.limits.memory | quote }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-consumer
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: kafka-consumer
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  selector:
    app: kafka-consumer
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kafka-consumer
  namespace: {{ .Values.namespaces.kafka }}
  labels:
    app.kubernetes.io/name: kafka-consumer
    app.kubernetes.io/part-of: kafka-demo
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "75"
spec:
  host: {{ printf "consumer.%s" .Values.ingressDomain | quote }}
  to:
    kind: Service
    name: kafka-consumer
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
