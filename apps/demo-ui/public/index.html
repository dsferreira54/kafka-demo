<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafka Streaming POC — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { rh: { red: '#EE0000', dark: '#151515' } }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn .25s ease-out }
    .step-active { background: rgba(238,0,0,.08); border-left: 3px solid #EE0000 }
    .step-item { border-left: 3px solid transparent; transition: all .15s }
    .step-item:hover { background: rgba(255,255,255,.04) }
    pre.code { background:#111827; color:#6ee7b7; border-radius:.5rem; padding:1rem; overflow-x:auto; font-size:.8125rem; white-space:pre-wrap; word-break:break-word }
    .spinner { display:inline-block; width:1.25rem; height:1.25rem; border:2px solid #d1d5db; border-top-color:#ef4444; border-radius:50%; animation:spin .6s linear infinite }
    @keyframes spin { to{transform:rotate(360deg)} }
    .ago-badge { display:inline-flex; align-items:center; font-size:.65rem; font-weight:600; padding:2px 8px; border-radius:9999px; white-space:nowrap; letter-spacing:.02em }
    .ago-now { background:#dcfce7; color:#15803d; animation:agoFlash .8s ease-out }
    .ago-recent { background:#dbeafe; color:#1d4ed8 }
    .ago-old { background:#f3f4f6; color:#9ca3af }
    @keyframes agoFlash { 0%{background:#86efac} 100%{background:#dcfce7} }
    .live-badge { display:inline-flex; align-items:center; gap:6px; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:#059669; background:#ecfdf5; padding:2px 10px; border-radius:9999px; border:1px solid #a7f3d0 }
    .live-dot { width:7px; height:7px; border-radius:50%; background:#10b981; animation:livePulse 2s ease-in-out infinite }
    @keyframes livePulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(16,185,129,.4)} 50%{opacity:.7;box-shadow:0 0 0 4px rgba(16,185,129,0)} }
    ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px }

    /* Architecture diagram */
    .arch-container { padding:8px 0 }
    .arch-top-row { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px; flex-wrap:wrap }
    .arch-node { display:flex; flex-direction:column; align-items:center; text-align:center; padding:12px 16px; border-radius:12px; border:2px solid; min-width:110px; position:relative; transition:transform .15s, box-shadow .15s }
    .arch-node:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.1) }
    .arch-icon { font-size:1.4rem; margin-bottom:4px }
    .arch-label { font-size:.75rem; font-weight:700; line-height:1.2 }
    .arch-sub { font-size:.6rem; color:#6b7280; margin-top:2px; line-height:1.2 }
    .arch-blue { background:#eff6ff; border-color:#93c5fd; color:#1e40af }
    .arch-red { background:#fef2f2; border-color:#fca5a5; color:#991b1b }
    .arch-green { background:#f0fdf4; border-color:#86efac; color:#166534 }
    .arch-indigo { background:#eef2ff; border-color:#a5b4fc; color:#3730a3 }
    .arch-amber { background:#fffbeb; border-color:#fcd34d; color:#92400e }
    .arch-teal { background:#f0fdfa; border-color:#5eead4; color:#115e59 }
    .arch-purple { background:#faf5ff; border-color:#c4b5fd; color:#5b21b6 }
    .arch-arrow { width:32px; display:flex; align-items:center; color:#9ca3af }
    .arch-arrow svg { width:100% }
    .arch-arrow-down { display:flex; justify-content:center; padding:4px 0; color:#9ca3af }
    .arch-arrow-down svg { height:20px }
    .arch-mid-label { text-align:center; margin:8px 0 4px; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#6b7280 }
    .arch-mid-label span { background:#f3f4f6; padding:2px 12px; border-radius:9999px; border:1px solid #e5e7eb }
    .arch-connect-row { display:flex; justify-content:center; gap:24px; flex-wrap:wrap }
    .arch-connect-group { display:flex; flex-direction:column; align-items:center; gap:0 }
    .arch-schema-float { text-align:center; margin:-4px 0 8px; position:relative }
    .arch-schema-line { width:1px; height:12px; background:#c4b5fd; margin:0 auto }
  </style>
</head>
<body class="flex h-screen bg-gray-50 text-gray-900 overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-72 bg-rh-dark text-white flex flex-col flex-shrink-0">
    <div class="px-5 py-6 border-b border-gray-800">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-rh-red flex items-center justify-center font-bold text-sm">K</div>
        <div>
          <h1 class="font-bold text-base leading-tight">Kafka Streaming POC</h1>
          <p class="text-gray-400 text-xs mt-0.5">Roteiro de Demonstração</p>
        </div>
      </div>
    </div>
    <nav id="step-nav" class="flex-1 overflow-y-auto py-3"></nav>
    <div class="px-5 py-4 border-t border-gray-800 flex items-center justify-between">
      <span class="text-xs text-gray-500">Red Hat Stack Demo</span>
      <button onclick="resetPoc()" title="Restaurar estado inicial" class="text-gray-600 hover:text-gray-300 transition-colors p-1 rounded hover:bg-gray-800"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 9 9"/><path d="M3 12V3"/><path d="M3 12H12"/></svg></button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div class="flex-1 overflow-y-auto">
      <div id="step-content" class="max-w-5xl mx-auto px-8 py-8"></div>
    </div>
    <div class="border-t bg-white px-8 py-3 flex justify-between items-center max-w-5xl mx-auto w-full">
      <button id="btn-prev" onclick="prevStep()" class="text-sm text-gray-600 hover:text-gray-900 font-medium px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">← Anterior</button>
      <span id="step-indicator" class="text-xs text-gray-400"></span>
      <button id="btn-next" onclick="nextStep()" class="text-sm text-white bg-rh-red hover:bg-red-700 font-medium px-4 py-2 rounded-lg transition-colors">Próximo →</button>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
