<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafka Streaming POC — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { rh: { red: '#EE0000', dark: '#151515' } }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn .25s ease-out }
    .step-active { background: rgba(238,0,0,.08); border-left: 3px solid #EE0000 }
    .step-item { border-left: 3px solid transparent; transition: all .15s }
    .step-item:hover { background: rgba(255,255,255,.04) }
    pre.code { background:#111827; color:#6ee7b7; border-radius:.5rem; padding:1rem; overflow-x:auto; font-size:.8125rem; white-space:pre-wrap; word-break:break-word }
    .spinner { display:inline-block; width:1.25rem; height:1.25rem; border:2px solid #d1d5db; border-top-color:#ef4444; border-radius:50%; animation:spin .6s linear infinite }
    @keyframes spin { to{transform:rotate(360deg)} }
    ::-webkit-scrollbar { width:6px } ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px }
  </style>
</head>
<body class="flex h-screen bg-gray-50 text-gray-900 overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-72 bg-rh-dark text-white flex flex-col flex-shrink-0">
    <div class="px-5 py-6 border-b border-gray-800">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-rh-red flex items-center justify-center font-bold text-sm">K</div>
        <div>
          <h1 class="font-bold text-base leading-tight">Kafka Streaming POC</h1>
          <p class="text-gray-400 text-xs mt-0.5">Roteiro de Demonstração</p>
        </div>
      </div>
    </div>
    <nav id="step-nav" class="flex-1 overflow-y-auto py-3"></nav>
    <div class="px-5 py-4 border-t border-gray-800 text-xs text-gray-500">Red Hat Stack Demo</div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div class="flex-1 overflow-y-auto">
      <div id="step-content" class="max-w-5xl mx-auto px-8 py-8"></div>
    </div>
    <div class="border-t bg-white px-8 py-3 flex justify-between items-center max-w-5xl mx-auto w-full">
      <button id="btn-prev" onclick="prevStep()" class="text-sm text-gray-600 hover:text-gray-900 font-medium px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">← Anterior</button>
      <span id="step-indicator" class="text-xs text-gray-400"></span>
      <button id="btn-next" onclick="nextStep()" class="text-sm text-white bg-rh-red hover:bg-red-700 font-medium px-4 py-2 rounded-lg transition-colors">Próximo →</button>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
